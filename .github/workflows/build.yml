
name: Abu Sabra APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android Project
        run: |
          GRADLE_FILE=$(find . -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "Android Gradle project not found"
            find . -maxdepth 4 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          while [ "$PROJECT_DIR" != "." ] && \
            [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
            [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; do
            PROJECT_DIR=$(dirname "$PROJECT_DIR")
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Sabra-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
